<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.webmanifest">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Let A Human In</title>
  <style>html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; } #unity-canvas { position: fixed !important; left: 0; top: 0; width: 100vw !important; height: 100vh !important; display: block; background: #000; } @supports (height: 100dvh) { #unity-canvas { height: 100dvh !important; } } @media (orientation: portrait) and (max-width: 900px) { #turn { display: flex; } } #turn { display: none; position: fixed; inset: 0; z-index: 10; align-items: center; justify-content: center; background: #000; color: #fff; font: 20px sans-serif; text-align: center; padding: 24px; }</style></head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <div id="turn">Turn your phone sideways to play</div>
    <canvas id="unity-canvas" width=960 height=600 tabindex="-1" style=" background: #000"></canvas>
    <script src="Build/LAHI-WebGL.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";

      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/LAHI-WebGL.data",
        frameworkUrl: "Build/LAHI-WebGL.framework.js",
        codeUrl: "Build/LAHI-WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Let A Human In",
        productVersion: "1.0",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      }).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
